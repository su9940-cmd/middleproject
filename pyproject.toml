[project]
name = "middle-project"
version = "0.1.0"
description = "Industrial safety closed-loop multi-agent system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter==1.1.1",
    "pandas==2.3.3",
    "tqdm==4.67.1",
    "langchain==1.0.2",
    "langchain-core>=1.0.3,<2.0.0",
    "langgraph>=1.0.0,<1.1.0",
    "langchain-community==0.4.1",
    "langchain-experimental==0.0.42",
    "langchain-pinecone>=0.2.0",
    "langchain-openai==1.0.2",
    "sentence-transformers==5.1.2",
    "langchain-huggingface==1.0.1",
    "langchain-ollama==1.0.0",
    "torch==2.9.1",
    "transformers==4.57.1",
    "tokenizers>=0.21.0",
    "huggingface-hub>=0.28.0",
    "langchainhub>=0.1.21",
    "jq==1.10.0",
    "beautifulsoup4==4.14.2",
    "requests==2.32.5",
    "pypdf==6.1.3",
    "pdfplumber==0.11.7",
    "langchain-pymupdf4llm==0.5.0",
    "tiktoken==0.12.0",
    "matplotlib==3.10.7",
    "docx2txt>=0.9",
    "python-dotenv==1.2.1",
    "pyyaml>=6.0.0",
    "scikit-learn==1.7.2",
    "joblib>=1.4.0",
    "pydantic>=2.0.0",
    "chromadb==1.3.2",
    "langchain-chroma==1.0.0",
    "pinecone>=5.3.0",
    "psycopg2-binary==2.9.11",
    "langchain-postgres==0.0.16",
    "ragas==0.3.9",
    "gradio>=5.0.0",
    "streamlit>=1.41.0",
    "langgraph-checkpoint<4",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "sqlalchemy>=2.0.51",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
